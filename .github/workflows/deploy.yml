name: deploy

# v1 production deploy — the goliajp instance of the self-hosted
# stack — the first self-host customer is us.
#
# Lands on the self-hosted lx64 runner: build the webapp, rsync it
# to the bind-mounted dist dir, rsync source, install the compose
# file from this repo, write .env from repo secrets,
# build + up the v1 services, then smoke against the version field
# (a 200 from an old binary answers "healthy?" exactly like a new
# one — only the version proves the deploy shipped).
#
# Trigger surface:
#   - push to master → after `build` completes green for the SHA.
#   - push to release/* → deploy directly.
#   - workflow_dispatch → manual.

on:
  push:
    branches:
      - 'release/*'
  workflow_run:
    workflows: ['build']
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-lx64-sentori
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The gate in front of a release deploy.
  #
  # `release/*` used to deploy production having run no checks at all:
  # build.yml does not trigger on it, neither does v0.2-core-check, so
  # the only thing standing between a laptop and production was whether
  # the person remembered to run `bun run preflight`. Every other path
  # into production is gated; the one that ships explicit versions was
  # not.
  #
  # `force_all: true` because a release commit touches VERSION,
  # CHANGELOG, two Cargo files and openapi.json — path filtering would
  # skip the webapp and sdk jobs on exactly the commit that ships them.
  # A deploy publishes the tree, not the diff.
  #
  # Skipped on the master line: build.yml has already run and gone
  # green there, which is what `workflow_run` waited for.
  gate:
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/build.yml
    with:
      force_all: true
    secrets: inherit

  # The image is built in parallel with the gate rather than after it.
  # On the release line the gate takes about 380 s and this build took
  # 303 s, and the two were strictly serial although the build reads the
  # tree and not the gate's verdict. Nothing here is live: the build
  # publishes a sha tag, and what makes an image serve traffic is the
  # retag in `deploy`, which does need the gate. A red gate therefore
  # leaves one unreferenced image behind and changes nothing else.
  build-image:
    runs-on: [self-hosted, lx64]
    timeout-minutes: 45
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      REMOTE_DIR: /apps/sentori

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Same pinning as `deploy`: `workflow_run` would otherwise give
          # the default branch's HEAD instead of the SHA that went green.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Tag for this tree
        id: tag
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Rsync source into /apps/sentori/src
        run: |
          mkdir -p "${REMOTE_DIR}/src"
          rsync -a --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude 'self-hosted/server/target' \
            --exclude 'core/target' \
            --exclude 'webapp/dist' \
            ./ "${REMOTE_DIR}/src/"

      # `docker compose build` would need the compose file and .env
      # installed on the host first, and both are live configuration:
      # writing them before the gate has spoken would leave a red gate
      # with production config the running containers were never checked
      # against. The compose service adds nothing to this build but a
      # context and a dockerfile path, both given here, so the image is
      # the same one either way.
      - name: Build the server image
        env:
          # The cargo cache mounts in the Dockerfile are a BuildKit
          # feature; an old default builder would fail to parse them.
          DOCKER_BUILDKIT: '1'
        run: |
          docker build \
            -f "${REMOTE_DIR}/src/self-hosted/docker/Dockerfile" \
            -t "sentori-server-v1:${{ steps.tag.outputs.tag }}" \
            "${REMOTE_DIR}/src"

  deploy:
    needs: [gate, build-image]
    runs-on: [self-hosted, lx64]
    timeout-minutes: 45
    # `always()` so the master line — where `gate` is skipped — still
    # deploys; `skipped` and `success` pass, anything else does not.
    # Without `always()` a skipped dependency cancels this job.
    if: >-
      always() &&
      (needs.gate.result == 'success' || needs.gate.result == 'skipped') &&
      needs.build-image.result == 'success' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')

    env:
      REMOTE_DIR: /apps/sentori
      COMPOSE_FILE: /apps/sentori/docker-compose.yml

    steps:
      - uses: actions/checkout@v4
        with:
          # `workflow_run` defaults to the default branch's HEAD, not
          # the SHA that triggered the upstream build. Pin to the
          # upstream SHA so we deploy exactly what went green.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Extract release version
        id: ver
        run: |
          # release/vX.Y.Z branches carry the version; master-line
          # deploys assert against Cargo.toml instead (which is what
          # prod-drift compares against, too).
          branch="${GITHUB_REF_NAME:-master}"
          if [[ "$branch" == release/* ]]; then
            version="${branch#release/}"
            version="${version#v}"
          else
            version=$(grep -m1 '^version' self-hosted/server/Cargo.toml \
              | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "==> deploying version $version"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build webapp (dashboard SPA)
        working-directory: webapp
        run: |
          bun install --frozen-lockfile
          bun run build

      # Production serves the SPA from this directory rather than the
      # copy baked into the image, so a dashboard-only change ships
      # without an image rebuild. Stays owned by the runner: the mount
      # is :ro and distroless nonroot only needs the world-read bit.
      - name: Rsync webapp/dist → /apps/sentori/webapp-dist
        run: |
          install -d -m 0755 "${REMOTE_DIR}/webapp-dist"
          rsync -a --delete --chmod=D755,F644 \
            webapp/dist/ "${REMOTE_DIR}/webapp-dist/"

      - name: Install the compose file
        run: |
          SRC_COMPOSE="${REMOTE_DIR}/src/deploy/docker-compose.t01.yml"
          if [ -f "${COMPOSE_FILE}" ] && ! diff -q "$SRC_COMPOSE" "${COMPOSE_FILE}" >/dev/null; then
            echo "the file on the host differs from this release; installing this one:"
            diff -u "${COMPOSE_FILE}" "$SRC_COMPOSE" || true
          fi
          install -m 0644 "$SRC_COMPOSE" "${COMPOSE_FILE}"

      - name: Write .env
        env:
          SENTORI_PG_PASSWORD: ${{ secrets.SENTORI_PG_PASSWORD }}
          SENTORI_SMTP_HOST: ${{ secrets.SENTORI_SMTP_HOST }}
          SENTORI_SMTP_PORT: ${{ secrets.SENTORI_SMTP_PORT }}
          SENTORI_SMTP_USER: ${{ secrets.SENTORI_SMTP_USER }}
          SENTORI_SMTP_PASS: ${{ secrets.SENTORI_SMTP_PASS }}
          SENTORI_SMTP_FROM: ${{ secrets.SENTORI_SMTP_FROM }}
          SENTORI_SMTP_TLS: ${{ secrets.SENTORI_SMTP_TLS }}
          # Still read by the v0.2 rollback services defined in the
          # same compose file; drops with them in S9.
          SENTORI_SESSION_SECRET: ${{ secrets.SENTORI_SESSION_SECRET }}
        run: |
          umask 077
          cat > "${REMOTE_DIR}/.env" <<EOF
          SENTORI_PG_PASSWORD=${SENTORI_PG_PASSWORD}
          SENTORI_SMTP_HOST=${SENTORI_SMTP_HOST}
          SENTORI_SMTP_PORT=${SENTORI_SMTP_PORT:-587}
          SENTORI_SMTP_USER=${SENTORI_SMTP_USER}
          SENTORI_SMTP_PASS=${SENTORI_SMTP_PASS}
          SENTORI_SMTP_FROM=${SENTORI_SMTP_FROM:-sentori@golia.jp}
          SENTORI_SMTP_TLS=${SENTORI_SMTP_TLS:-starttls}
          SENTORI_SESSION_SECRET=${SENTORI_SESSION_SECRET}
          RUST_LOG=info,sentori_server=info
          EOF
          chmod 600 "${REMOTE_DIR}/.env"

      # The image that was built while the gate ran becomes the live one
      # here and nowhere else — nothing earlier moved `latest`. There is
      # no `--build` either, so this step cannot quietly compile a tree
      # the gate never saw.
      - name: Point latest at the gated image, up the v1 stack
        working-directory: /apps/sentori
        run: |
          docker tag "sentori-server-v1:${{ needs.build-image.outputs.tag }}" \
            sentori-server-v1:latest
          docker compose --env-file .env -f docker-compose.yml up -d \
            postgres-v1 server-v1

      # `latest` now holds the image; dropping the sha tag keeps the
      # deploy host from collecting one per release. It runs after the
      # stack is up and must not fail a deploy that already happened.
      - name: Drop the sha tag
        continue-on-error: true
        run: docker rmi "sentori-server-v1:${{ needs.build-image.outputs.tag }}"

      - name: Smoke — v1 healthz + version
        run: |
          set -e
          fail() { echo "smoke FAIL: $1" >&2; exit 1; }
          # migrations run at boot — allow a startup window
          body=''
          for i in $(seq 1 60); do
            body=$(curl -s --max-time 5 http://127.0.0.1:18092/healthz || true)
            case "$body" in *'"status":"ok"'*) break;; esac
            if [ "$i" = "60" ]; then
              echo "==> server-v1 never went healthy — recent logs:"
              docker compose -f "${COMPOSE_FILE}" logs --tail 100 server-v1 || true
              fail "healthz: $body"
            fi
            sleep 2
          done
          # session gate engaged (no cookie → 401)
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18092/auth/me)
          test "$status" = "401" || fail "/auth/me expected 401, got $status"
          # SPA fallback serves the dashboard shell
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18092/login)
          test "$status" = "200" || fail "SPA /login expected 200, got $status"
          # The version actually answering has to be the version we
          # just checked out. Everything above passes just as well when
          # the image never rebuilt and an old binary is still serving.
          want='${{ steps.ver.outputs.version }}'
          got="${body##*\"version\":\"}"
          got="${got%%\"*}"
          test "$want" = "$got" \
            || fail "deployed $got but this commit is $want — the image did not rebuild"
          echo "==> v1 smoke OK (serving $got)"

      - name: Tag release version
        # Only on the release/* push path — master-line deploys don't
        # re-tag.
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          git tag "v${{ steps.ver.outputs.version }}" || true
          git push origin "v${{ steps.ver.outputs.version }}" || true
