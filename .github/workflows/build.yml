name: build

# Phase 53 — surface-aware CI.
#
# Previously every push ran every job (server-test + 10-matrix sdk + web +
# docker-build), so a typo in web/ would still wait on 10 SDK builds,
# server tests, and a docker push. Worse, any flake in an unrelated job
# fired a failure email for a touch that should never have run it in the
# first place.
#
# Now: a single `changes` filter job detects which top-level surface a
# commit touched, and the heavy jobs are gated on it. Skipped jobs report
# as "skipped" (counted as a pass for `needs`), so downstream `docker-build`
# can still fire on master without the upstreams that didn't have to run.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# v2.1 — opt into Node.js 24 ahead of GitHub Actions' 2026-06-02
# forced cutover. Several pinned action versions in this file
# (actions/checkout@v4, dorny/paths-filter@v3, docker/login-action@v3,
# docker/setup-buildx-action@v3, docker/build-push-action@v5) are
# still on Node 20 internally. Setting this env var instructs the
# runner to lift them to Node 24 now, so we don't get caught by a
# forced migration on a deploy day. Once each action ships a Node-24-
# native major bump, drop this env var alongside the version bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    # Single source of truth for "what did this commit touch?". The
    # individual build jobs read these outputs to decide whether to run.
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      webapp: ${{ steps.filter.outputs.webapp }}
      sdk: ${{ steps.filter.outputs.sdk }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `infra` covers the workflow files themselves + cross-cutting
          # repo config. Any change here re-runs everything so we don't
          # let a broken CI config slip in unnoticed.
          filters: |
            infra:
              - '.github/workflows/**'
              - 'package.json'
              - 'bun.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
            # Drives the `server-test` job, which after the v0.1
            # decommission runs the cli gates and the repo-wide checks
            # (rfc3339, orphan modules, cargo features) rather than
            # anything under server/.
            server:
              - 'core/**'
              - 'self-hosted/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            webapp:
              - 'webapp/**'
            sdk:
              - 'sdk/**'

  # A workflow file GitHub can't parse is accepted by `git push` and
  # then fails as a run with zero jobs and no readable log. Validate
  # them here so that failure mode can't reach master.
  workflows:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    # No postgres/valkey services and no disk-freeing step: both existed
    # for the legacy v0.1 `server/` workspace, deleted in the v1 S0
    # clear-out. The v0.2+ server surface (core/ + self-hosted/server/)
    # is gated by `v0.2-core-check.yml`, which owns the DB-backed
    # integration tests; this job runs the repo-wide source checks.
    # (The v0.x Rust cli/ was razed in the v1 closeout; the TS CLI in
    # sdk/cli is covered by the sdk job.)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: check rfc3339 serde annotations (phase 29 sub-C)
        run: bash scripts/check-rfc3339.sh

      # Two load-bearing INSERTs had more values than columns.
      # Postgres refuses such a statement at prepare time, so the
      # endpoint always 500s — and from the outside that is
      # indistinguishable from a feature nobody uses, which is exactly
      # how push read for a year.
      - name: SQL columns balance, and reads are selected
        run: node scripts/check-sql-inserts.mjs

      # A file no `mod` reaches is never compiled, so nothing else in
      # this job would notice it. That is how the rate limiter sat
      # written-but-dead while ingest ran unlimited.
      - name: check for orphan modules
        run: bash scripts/check-orphan-modules.sh

      # The SDK reference documented a v0.2-era `init()` for months:
      # an option that did not exist, six that did and were unlisted,
      # and a required field marked optional with a default pointing
      # at someone else's server. None of it shows in a diff — the
      # type changes in one file, the table stays put in another.
      # A link in a document is a claim that the page exists. Four of
      # the SDK links in `docs/README.md` — the index of the
      # documentation — were 404s pointing into a site that had been
      # deleted.
      - name: relative links in docs resolve
        run: node scripts/check-doc-links.mjs

      - name: SDK reference matches InitConfig
        run: node scripts/check-sdk-doc-options.mjs

      # EventKind ↔ enum Kind, AttachmentKind ↔ KINDS. Maintained by
      # hand across a language boundary with nothing compiling them
      # together; a mismatch surfaces as an event rejected at ingest,
      # on a device, into a log.
      - name: wire unions agree across the SDK/server boundary
        run: node scripts/check-wire-contracts.mjs

      - name: check cargo features (v2.20 P2 — anti-feature-drift)
        run: bash scripts/check-cargo-features.sh
  webapp:
    needs: changes
    if: needs.changes.outputs.webapp == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: webapp — install + check + build
        working-directory: webapp
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      # Render every route against canned data and read what happened.
      #
      # tsc and eslint cannot see a page that throws at runtime: the
      # crash view mapped JSON.parse over a replay's lines inside one
      # promise, so a single half-written line made the whole recording
      # report "failed to load", and it shipped that way for months
      # past every green gate. It took one honest sweep to find.
      #
      # The gate is console errors and paths the mock did not answer —
      # both of which render as a plausible page. Screenshots go up as
      # an artifact because layout, wrapping and contrast are not
      # things a CI job can judge; a person still has to look, and this
      # is what they look at.
      - name: webapp — render sweep
        working-directory: webapp
        run: |
          # Resolved rather than assumed: the sweep looks for Chrome in
          # the usual places, and if the runner image ever drops it the
          # message should say that instead of failing inside CDP.
          command -v google-chrome >/dev/null 2>&1 ||
            command -v chromium-browser >/dev/null 2>&1 || {
              echo "no Chrome on this runner — set CHROME_PATH or install one"
              exit 1
            }
          bun run mock > /tmp/mock.log 2>&1 &
          bun run preview > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5599/ >/dev/null && \
            curl -sf http://localhost:8080/auth/me >/dev/null && break
            sleep 1
          done
          bun run sweep /tmp/sweep zh-CN dark

      - name: webapp — sweep artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-sweep
          path: /tmp/sweep
          retention-days: 7

  # The shipped stack, from `docker compose up` to an event read back.
  # Slower than the unit gates and worth it: it is the only thing that
  # exercises the real image, the real compose file and the real
  # migrations together, and every failure it asserts is one that has
  # actually happened — a generated owner password filtered out of the
  # log by a quieter RUST_LOG, an event resend answered with a 500 that
  # our own contract tells the SDK to retry.
  e2e:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        run: bash self-hosted/tests/e2e/smoke.sh

  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.infra == 'true'
    # Matrix-run all SDKs in parallel so any one of them going red fails
    # the build immediately. `fail-fast: false` keeps a single SDK
    # regression from masking the rest.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - sdk/core
          - sdk/react-native
          - sdk/expo
          - sdk/cli

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: install workspace
        run: bun install --frozen-lockfile

      # Build every SDK's lib/ first. Each matrix cell is isolated — without
      # this, packages that import a sibling SDK can't resolve the
      # workspace symlink to a `.d.ts`.
      - name: build all SDKs (resolve cross-package type refs)
        run: bun run build:sdks

      - name: ${{ matrix.package }} — typecheck + test + build
        working-directory: ${{ matrix.package }}
        run: |
          bun run typecheck
          bun test
          bun run build

      # Iron-rule dimension 4 (bounded footprint). It ran only in local
      # preflight, so the budget was enforced by whoever remembered to
      # run it — which is not enforcement. Once per matrix is redundant
      # and costs a second; a size budget nobody's machine has to
      # remember is worth the second.
      # An export map is a promise about what an import resolves to.
      # 5.7.0 advertised `./compat`, `./expo-compat` and `./feedback`
      # with no such files in the tarball — a package that installs
      # cleanly and fails at import.
      - name: every advertised entry point exists
        run: node scripts/check-package-entrypoints.mjs

      # And a peer range is a promise about what it installs alongside.
      # 6.0.0 shipped `expo-modules-core >=56.0.0 <57.0.0` while this
      # repo built against 55 and the current Expo SDK ships 57 — a
      # window nothing occupied. `npm install @goliapkg/sentori-expo`
      # answered ERESOLVE, which is the hardest way to fail the one
      # thing this SDK has to be.
      # An option the public types advertise must be read by the code.
      # `PushRegisterOptions.linkHash` was left over from an identity
      # design that had been removed, with a doc comment still calling
      # it the way to target a user — so an integrator set it, got
      # `ok: true`, and never became addressable. `metadata` was
      # advertised, never sent, and had no field on the server to
      # receive it.
      # `userKey` is computed in TypeScript, Swift and Kotlin, and a
      # device that hashes differently stops matching the events from
      # the same person — the push reaches nobody and nothing reports
      # it. The native suites assert against vectors generated from
      # the TypeScript; this fails when the TypeScript moved and the
      # vectors did not.
      - name: identity vectors match the source of truth
        run: node scripts/gen-identity-vectors.mjs --check

      - name: public options are read by the code
        run: node scripts/check-dead-options.mjs

      - name: peer ranges contain the versions we build against
        run: node scripts/check-peer-ranges.mjs

      - name: SDK size budget
        run: bash scripts/check-sdk-size.sh

  # `docker-build` lived here and pushed ghcr.io/goliajp/sentori-server
  # and ...-web from docker/Dockerfile.{server,web}. Both were the v0.1
  # build, decommissioned 2026-07-23. The v0.2 image is published by
  # `v0.2 self-hosted — docker image build + push to GHCR`, on master
  # and on release tags, under a different name
  # (goliajp/sentori/sentori-server), so nothing was sharing a tag.