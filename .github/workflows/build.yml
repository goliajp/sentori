name: build

# Phase 53 — surface-aware CI.
#
# Previously every push ran every job (server-test + 10-matrix sdk + web +
# docker-build), so a typo in web/ would still wait on 10 SDK builds,
# server tests, and a docker push. Worse, any flake in an unrelated job
# fired a failure email for a touch that should never have run it in the
# first place.
#
# Now: a single `changes` filter job detects which top-level surface a
# commit touched, and the heavy jobs are gated on it. Skipped jobs report
# as "skipped" (counted as a pass for `needs`), so downstream `docker-build`
# can still fire on master without the upstreams that didn't have to run.

on:
  push:
    # develop as well as master. Until 2026-09-28 this ran on master
    # only, so webapp, the TypeScript SDKs, scripts, docs, the CLI and
    # the docker build had no CI at all until the branch that deploys —
    # their first gate ran after the point of no return. The paths filter
    # below still decides which jobs run.
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml as the gate in front of a `release/*` deploy.
  # `release/*` pushes straight to production and used to run no checks
  # at all — local preflight was the entire gate, which is a discipline
  # rather than a guarantee, on the one path whose mistakes are live.
  #
  # `workflow_call` and not a second `push:` trigger plus `workflow_run`:
  # workflow_run fires asynchronously and has silently failed to fire
  # here before, which is survivable for the master line (it redeploys
  # what is already live) and not for the release line (it would let a
  # deploy proceed with no gate having run).
  workflow_call:
    inputs:
      force_all:
        description: >-
          Run every job regardless of which paths changed. A release
          commit touches five version files, so path filtering would
          skip the webapp and sdk jobs entirely — but a deploy ships
          the whole tree, not the diff.
        type: boolean
        default: false

# v2.1 — opt into Node.js 24 ahead of GitHub Actions' 2026-06-02
# forced cutover. Several pinned action versions in this file
# (actions/checkout@v4, dorny/paths-filter@v3, docker/login-action@v3,
# docker/setup-buildx-action@v3, docker/build-push-action@v5) are
# still on Node 20 internally. Setting this env var instructs the
# runner to lift them to Node 24 now, so we don't get caught by a
# forced migration on a deploy day. Once each action ships a Node-24-
# native major bump, drop this env var alongside the version bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A newer push to the same branch supersedes the tree this run is
# checking. Master is never cancelled — its run is the record that a
# shipped sha was gated — and neither is a release branch, whose run is
# the gate deploy.yml waits on.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/master' &&
        !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  changes:
    # Single source of truth for "what did this commit touch?". The
    # individual build jobs read these outputs to decide whether to run.
    runs-on: ubuntu-latest
    outputs:
      server: ${{ inputs.force_all && 'true' || steps.filter.outputs.server }}
      webapp: ${{ inputs.force_all && 'true' || steps.filter.outputs.webapp }}
      sdk: ${{ inputs.force_all && 'true' || steps.filter.outputs.sdk }}
      infra: ${{ inputs.force_all && 'true' || steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `infra` covers the workflow files themselves + cross-cutting
          # repo config. Any change here re-runs everything so we don't
          # let a broken CI config slip in unnoticed.
          filters: |
            infra:
              - '.github/**'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - 'scripts/**'
            # Drives the `server-test` job, which after the v0.1
            # decommission runs the cli gates and the repo-wide checks
            # (rfc3339, orphan modules, cargo features) rather than
            # anything under server/.
            server:
              - 'core/**'
              - 'self-hosted/**'
              - '.dockerignore'
            webapp:
              - 'webapp/**'
            sdk:
              - 'sdk/**'

  # A workflow file GitHub can't parse is accepted by `git push` and
  # then fails as a run with zero jobs and no readable log. Validate
  # them here so that failure mode can't reach master.
  workflows:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # The toolchain these files pin is part of what they are. CI ran
      # bun 1.3.13 while the lockfiles here are written by 1.4.x, and
      # 1.3.13 re-resolves rather than reading them — `build` and
      # `mobile-e2e` went red on master with no dependency change, on a
      # tree where preflight had just passed with the developer's bun.
      #
      # It lives in this job because this job is about CI config, and
      # because it needs a bun to ask. The first version of this step
      # was in `server-test`, which has no bun, and failed with
      # `spawnSync bun ENOENT` — a gate that cannot run is not a gate.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: bun is the version CI installs, and no member has its own lockfile
        run: node scripts/check-bun-version.mjs

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    # No postgres/valkey services and no disk-freeing step: both existed
    # for the legacy v0.1 `server/` workspace, deleted in the v1 S0
    # clear-out. The v0.2+ server surface (core/ + self-hosted/server/)
    # is gated by `v0.2-core-check.yml`, which owns the DB-backed
    # integration tests; this job runs the repo-wide source checks.
    # (The v0.x Rust cli/ was razed in the v1 closeout; the TS CLI in
    # sdk/cli is covered by the sdk job.)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: check rfc3339 serde annotations (phase 29 sub-C)
        run: bash scripts/check-rfc3339.sh

      # Two load-bearing INSERTs had more values than columns.
      # Postgres refuses such a statement at prepare time, so the
      # endpoint always 500s — and from the outside that is
      # indistinguishable from a feature nobody uses, which is exactly
      # how push read for a year.
      - name: SQL columns balance, and reads are selected
        run: node scripts/check-sql-inserts.mjs

      # Three /metrics gauges queried something that could not answer —
      # two named tables the v1 rewrite deleted, one a `status` value
      # the column's CHECK forbids — and all three published `0`, which
      # is what a healthy gauge reads most of the time. Nothing raised
      # and nobody looked, for the life of the v1 schema.
      - name: every table our SQL names exists in the migrations
        run: node scripts/check-sql-tables-exist.mjs

      # 185 sites of ours evaluate `now()`, an `interval` or an
      # `extract` in the *session's* time zone, and none of them names
      # one. Two deployments of this image could mean different things
      # by the same query with nothing in the result to say so. Both
      # binaries pin UTC in the startup packet and read it back; this
      # checks nothing else opens a connection and the two copies of
      # the pinning module have not drifted.
      - name: every connection pins the session TimeZone
        run: node scripts/check-timezone-pinned.mjs

      # `sentori-server dump/export/import/restore/status` ships as a
      # binary and had no gate at all — no fmt, no clippy, no test. Its
      # table list was the pre-v1 kernel's: it reached seven of our
      # twenty-six tables and named twenty-seven that no longer exist,
      # and it survived a whole major rewrite that way.
      - name: cli fmt, clippy and tests
        run: |
          cd self-hosted/cli
          cargo fmt --check
          cargo clippy --all-targets --quiet -- -D warnings
          cargo test --quiet

      # A file no `mod` reaches is never compiled, so nothing else in
      # this job would notice it. That is how the rate limiter sat
      # written-but-dead while ingest ran unlimited.
      - name: check for orphan modules
        run: bash scripts/check-orphan-modules.sh

      # The SDK reference documented a v0.2-era `init()` for months:
      # an option that did not exist, six that did and were unlisted,
      # and a required field marked optional with a default pointing
      # at someone else's server. None of it shows in a diff — the
      # type changes in one file, the table stays put in another.
      # A link in a document is a claim that the page exists. Four of
      # the SDK links in `docs/README.md` — the index of the
      # documentation — were 404s pointing into a site that had been
      # deleted.
      - name: relative links in docs resolve
        run: node scripts/check-doc-links.mjs

      - name: SDK reference matches InitConfig
        run: node scripts/check-sdk-doc-options.mjs

      # The Kotlin doc showed a Gradle coordinate and no import. The
      # groupId is `jp.golia.sentori`, the package is `com.sentori`,
      # and an integrator guessed the obvious thing — then spent the
      # afternoon on repository config, because a resolution failure
      # and an import failure look nothing alike.
      - name: imports shown in the native docs resolve to real code
        run: node scripts/check-doc-imports.mjs

      # EventKind ↔ enum Kind, AttachmentKind ↔ KINDS. Maintained by
      # hand across a language boundary with nothing compiling them
      # together; a mismatch surfaces as an event rejected at ingest,
      # on a device, into a log.
      - name: wire unions agree across the SDK/server boundary
        run: node scripts/check-wire-contracts.mjs

      # Ran in preflight only until the deploy's compose file moved
      # into this repo. A knob the compose hands the container that
      # the server no longer reads is a setting that silently stops
      # taking effect, and production is where that is expensive.
      - name: docs and compose name only env vars the code reads
        run: node scripts/check-env-vars-real.mjs

      - name: check cargo features (v2.20 P2 — anti-feature-drift)
        run: bash scripts/check-cargo-features.sh
  webapp:
    needs: changes
    if: needs.changes.outputs.webapp == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: webapp — install + check + build
        working-directory: webapp
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      # Render every route against canned data and read what happened.
      #
      # tsc and eslint cannot see a page that throws at runtime: the
      # crash view mapped JSON.parse over a replay's lines inside one
      # promise, so a single half-written line made the whole recording
      # report "failed to load", and it shipped that way for months
      # past every green gate. It took one honest sweep to find.
      #
      # The gate is console errors and paths the mock did not answer —
      # both of which render as a plausible page. Screenshots go up as
      # an artifact because layout, wrapping and contrast are not
      # things a CI job can judge; a person still has to look, and this
      # is what they look at.
      - name: webapp — render sweep
        working-directory: webapp
        run: |
          # Resolved rather than assumed: the sweep looks for Chrome in
          # the usual places, and if the runner image ever drops it the
          # message should say that instead of failing inside CDP.
          command -v google-chrome >/dev/null 2>&1 ||
            command -v chromium-browser >/dev/null 2>&1 || {
              echo "no Chrome on this runner — set CHROME_PATH or install one"
              exit 1
            }
          bun run mock > /tmp/mock.log 2>&1 &
          bun run preview > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5599/ >/dev/null && \
            curl -sf http://localhost:8080/auth/me >/dev/null && break
            sleep 1
          done
          bun run sweep /tmp/sweep zh-CN dark

      - name: webapp — sweep artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-sweep
          path: /tmp/sweep
          retention-days: 7

  # The shipped stack, from `docker compose up` to an event read back.
  # Slower than the unit gates and worth it: it is the only thing that
  # exercises the real image, the real compose file and the real
  # migrations together, and every failure it asserts is one that has
  # actually happened — a generated owner password filtered out of the
  # log by a quieter RUST_LOG, an event resend answered with a 500 that
  # our own contract tells the SDK to retry.
  # Fourteen checks whose only enforcement was a developer remembering
  # to run preflight. Several guard a published surface: the mirror's
  # allowlist, the authorisation on every project-scoped admin
  # endpoint, the project scoping on every attachment read, and the
  # agreement between the generated OpenAPI / error reference and the
  # code. No path filter and no `needs` — a docs-only change skips
  # server-test, which is where most of them used to live, and these
  # are exactly the changes that break them. They need node and
  # nothing installed.
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every surface is named by a workflow that runs on develop
        run: node scripts/check-surface-gates.mjs

      # Each of these checkers was green the day it was written and green
      # ever since, which is also what one looks like after the code it
      # reads moves out from under it. This reintroduces the defect each
      # exists for, in a copy of the tracked tree, and requires it to say
      # so.
      - name: each gate goes red on the defect it exists for
        run: node scripts/check-gates-fail.mjs

      - name: the mirror ships the docs and the build, and nothing internal
        run: node scripts/check-mirror.mjs
      - name: docs name only APIs and packages that exist
        run: node scripts/check-docs-api-truth.mjs
      - name: every markdown code fence closes
        run: node scripts/check-md-fences.mjs
      - name: the OpenAPI document matches the router
        run: node scripts/gen-openapi.mjs --check
      - name: the error reference matches the handlers
        run: node scripts/gen-error-reference.mjs --check
      - name: every project-scoped admin endpoint authorises the caller
        run: node scripts/check-admin-authorisation.mjs
      - name: every read of event_attachments is project-scoped
        run: node scripts/check-attachment-scoping.mjs
      - name: no 200 carries an error body
        run: node scripts/check-error-status.mjs
      - name: one casing on the v1 wire
        run: node scripts/check-wire-case.mjs
      - name: alert + dashboard expressions name metrics that exist
        run: node scripts/check-metric-names.mjs
      - name: the server snippets name the route the server serves
        run: node scripts/check-push-snippets.mjs
      - name: compose healthchecks are exec form
        run: node scripts/check-compose-healthchecks.mjs
      - name: no text ordering the operators image decides
        run: node scripts/check-text-ordering.mjs

      # Every timestamp here was relative and only relative: an audit log
      # whose rows all read "3 minutes ago" cannot line anything up
      # against the world outside this product.
      - name: every rendered moment carries its absolute time
        run: node scripts/check-time-has-absolute.mjs
      - name: the RN native mirror matches sdk/native
        run: node scripts/sync-native-core.mjs --check
      # App Review rejects a required-reason API with no declared
      # reason, and the rejection lands on the host app's release.
      - name: what an iOS consumer gets matches what the sources do
        run: node scripts/check-ios-packaging.mjs
      # The Swift and Kotlin install lines sat three minors behind the
      # tree, so the page installed a build without crash delivery.
      - name: the install lines install the version we ship
        run: node scripts/check-doc-versions.mjs
      # A documented upload with no --api-url defaults to GOLIA's own
      # instance, so a self-hosted reader ships us their symbols and
      # the command exits 0.
      - name: CLI commands in the docs work when copied
        run: node scripts/check-doc-commands.mjs

  e2e:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        run: bash self-hosted/tests/e2e/smoke.sh

  sdk:
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.infra == 'true'
    # Matrix-run all SDKs in parallel so any one of them going red fails
    # the build immediately. `fail-fast: false` keeps a single SDK
    # regression from masking the rest.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - sdk/core
          - sdk/react-native
          - sdk/expo
          - sdk/cli

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: install workspace
        run: bun install --frozen-lockfile

      # Needs the network, so it cannot live in preflight. Reports
      # rather than fails: a drifted README is a reason to publish,
      # not a reason to block the build that would let you.
      - name: published READMEs match the repo
        run: node scripts/check-published-readme.mjs

      # Build every SDK's lib/ first. Each matrix cell is isolated — without
      # this, packages that import a sibling SDK can't resolve the
      # workspace symlink to a `.d.ts`.
      - name: build all SDKs (resolve cross-package type refs)
        run: bun run build:sdks

      - name: ${{ matrix.package }} — typecheck + test + build
        working-directory: ${{ matrix.package }}
        run: |
          bun run typecheck
          bun test
          bun run build

      # Iron-rule dimension 4 (bounded footprint). It ran only in local
      # preflight, so the budget was enforced by whoever remembered to
      # run it — which is not enforcement. Once per matrix is redundant
      # and costs a second; a size budget nobody's machine has to
      # remember is worth the second.
      # An export map is a promise about what an import resolves to.
      # 5.7.0 advertised `./compat`, `./expo-compat` and `./feedback`
      # with no such files in the tarball — a package that installs
      # cleanly and fails at import.
      - name: every advertised entry point exists
        run: node scripts/check-package-entrypoints.mjs

      # And a peer range is a promise about what it installs alongside.
      # 6.0.0 shipped `expo-modules-core >=56.0.0 <57.0.0` while this
      # repo built against 55 and the current Expo SDK ships 57 — a
      # window nothing occupied. `npm install @goliapkg/sentori-expo`
      # answered ERESOLVE, which is the hardest way to fail the one
      # thing this SDK has to be.
      # An option the public types advertise must be read by the code.
      # `PushRegisterOptions.linkHash` was left over from an identity
      # design that had been removed, with a doc comment still calling
      # it the way to target a user — so an integrator set it, got
      # `ok: true`, and never became addressable. `metadata` was
      # advertised, never sent, and had no field on the server to
      # receive it.
      # `userKey` is computed in TypeScript, Swift and Kotlin, and a
      # device that hashes differently stops matching the events from
      # the same person — the push reaches nobody and nothing reports
      # it. The native suites assert against vectors generated from
      # the TypeScript; this fails when the TypeScript moved and the
      # vectors did not.
      - name: identity vectors match the source of truth
        run: node scripts/gen-identity-vectors.mjs --check

      # Same shape, for what a replay is: when a keyframe is due, what
      # counts as a change, when a delta is a near-rewrite. Three
      # implementations that disagree play back a screen the user
      # never saw, and the player renders a wrong frame without
      # complaint.
      - name: replay vectors match the source of truth
        run: node scripts/gen-replay-vectors.mjs --check

      - name: public options are read by the code
        run: node scripts/check-dead-options.mjs

      - name: peer ranges contain the versions we build against
        run: node scripts/check-peer-ranges.mjs

      - name: SDK size budget
        run: bash scripts/check-sdk-size.sh

  # `docker-build` lived here and pushed ghcr.io/goliajp/sentori-server
  # and ...-web from docker/Dockerfile.{server,web}. Both were the v0.1
  # build, decommissioned 2026-07-23. The v0.2 image is published by
  # `v0.2 self-hosted — docker image build + push to GHCR`, on master
  # and on release tags, under a different name
  # (goliajp/sentori/sentori-server), so nothing was sharing a tag.