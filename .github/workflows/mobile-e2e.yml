name: mobile-e2e

# Native + symbolication checks that need more than the Linux unit-test
# runner.
#
# 2026-07-22 rewrite. The previous version had four jobs and all four
# were pointing at things that do not exist:
#
#   · ios-xctest         `-scheme SentoriTests`, but `sdk/react-native/ios`
#                        holds loose .swift files and no Xcode project.
#   · android-robolectric `./gradlew` in a directory with no wrapper, on a
#                        module that depends on `:expo-modules-core` and
#                        cannot build standalone.
#   · mailcatcher        legacy `server/` + `server/migrations`.
#   · sourcemap-e2e      symbolication round trip on the v1 server.
#
# It had been switched to `workflow_dispatch` in v0.4 with a note to
# restore the triggers "once those two are fixed", and then sat failing
# and unlooked-at from 2026-05-11. A gate nobody can run is not a gate;
# a red one nobody looks at is worse, because the red stops meaning
# anything.
#
# What is left runs, and runs on the code that ships.

# The path filters listed only the Android module and the example app.
# That fits `android-unit`, but `sourcemap-e2e` below builds and drives
# the *server*, and nothing in its path list is a server path. So it
# skipped every server release, and `GET .../releases` panicked from
# 2.15.0 to 2.21.1 with the one job that exercises it never running.
#
# A gate wired to the wrong paths is worse than no gate: it is green
# on the changes it cannot see.
on:
  push:
    branches: [develop, master]
    paths:
      - 'sdk/react-native/android/**'
      - 'sdk/native/**'
      - 'apps/rn-example/**'
      - 'self-hosted/server/**'
      - 'core/migrations/**'
      - 'scripts/sourcemap-e2e/**'
      - 'scripts/ios-live-ingest.sh'
      - 'scripts/android-live-ingest.sh'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'sdk/react-native/android/**'
      - 'sdk/native/**'
      - 'apps/rn-example/**'
      - 'self-hosted/server/**'
      - 'core/migrations/**'
      - 'scripts/sourcemap-e2e/**'
      - 'scripts/ios-live-ingest.sh'
      - 'scripts/android-live-ingest.sh'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The SDK's Android module has two Robolectric tests and has never
  # been able to run them: it is an Expo module, so it only builds
  # inside a host app's Gradle project. `apps/rn-example` is that host,
  # and expo-autolinking pulls the SDK in — the same path used to verify
  # on a real device.
  #
  # This closes the hole recorded in the project notes: changing a .kt
  # file passed every gate and shipped to npm unchecked, which is how
  # the v3.0.0 K2 bug got out.
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: install example app deps
        working-directory: apps/rn-example
        run: bun install --frozen-lockfile

      # `apps/rn-example/android` is a prebuild output and is
      # gitignored, so the runner has to generate it. Locally it is
      # already there, which is exactly why the first version of this
      # job passed review and then failed on a clean checkout.
      - name: expo prebuild (generates the host Gradle project)
        working-directory: apps/rn-example
        run: bunx expo prebuild --platform android --no-install

      # The module's Gradle path is decided by expo-autolinking at
      # configure time, so it is discovered rather than hardcoded — a
      # guessed name would silently pass by testing nothing.
      - name: Robolectric (SDK module, via host project)
        working-directory: apps/rn-example/android
        run: |
          MODULE=$(./gradlew projects --console=plain -q \
            | grep -oE "Project ':[a-z0-9-]*sentori[a-z0-9-]*'" \
            | head -1 | sed "s/Project '//;s/'//")
          if [ -z "$MODULE" ]; then
            echo "::error::the Sentori module is not in the host Gradle project;"
            echo "::error::expo-autolinking did not pick it up, so its tests cannot run"
            ./gradlew projects --console=plain -q | head -40
            exit 1
          fi
          echo "testing $MODULE"
          ./gradlew "$MODULE:testDebugUnitTest" --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          # The module builds in its own source tree, not under the host
          # project — the first version pointed at the host and uploaded
          # nothing, so a failing run had no report to read. Keyed on the
          # directory, which is stable; the Gradle project name is
          # assigned by autolinking and is not the directory name.
          path: |
            sdk/react-native/android/build/reports/tests/
            sdk/react-native/android/build/test-results/
          if-no-files-found: warn

  # The iOS native core, built and tested as a Swift package.
  #
  # `sdk/react-native/ios` held 214 lines of XCTest that had never run
  # once: the sources were loose files compiled only inside an Expo
  # module, so there was no module to `@testable import` and no scheme
  # for `xcodebuild` to name. Both tests that reached for an internal
  # API named one that does not exist — `persistForTesting` and
  # `viewTreeForTesting` — and nothing reported it, because nothing
  # built them.
  #
  # This is also the platform about to ship as its own artifact, and
  # the one with no automated gate of any kind until now.
  ios-native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The mirror the React Native pod compiles is generated from
      # this package. If they disagree, the pod ships something no
      # test here covered.
      - name: the RN mirror matches the package
        run: node scripts/sync-native-core.mjs --check

      # `| tail -40` here meant the first failure of this gate arrived
      # with the reason cut off: xcodebuild prints the assertion in the
      # middle of its output and several hundred lines of URLSession
      # noise after it. A gate that hides why it went red is one more
      # thing to reproduce locally before it can be read.
      - name: build + test
        working-directory: sdk/native/ios
        run: |
          if ! xcodebuild test \
              -scheme Sentori \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              > /tmp/xcodebuild.log 2>&1; then
            echo "── failures ──"
            grep -E "error: -\[|XCTAssert|' failed \(" /tmp/xcodebuild.log | head -40
            echo "── summary ──"
            grep -E "Executed [0-9]+ tests?" /tmp/xcodebuild.log | tail -2
            exit 1
          fi
          grep -E "Executed [0-9]+ tests?" /tmp/xcodebuild.log | tail -1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: warn

  # The Android artifact an app would actually depend on.
  #
  # These sources had no build of their own: they compiled inside the
  # React Native module and their tests ran by building the example
  # app. So the AAR an Android app depends on had never been
  # assembled, and the tests belonged to a module that exists for a
  # different reason.
  android-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: tests, in their own build
        working-directory: sdk/native/android
        run: ./gradlew testReleaseUnitTest --console=plain

      # Staging writes the exact files an upload would send. Central
      # validates the POM on receipt and rejects the whole bundle, so
      # a missing `<scm>` block is otherwise learned by re-staging a
      # release rather than by fixing one.
      - name: the artifact is complete enough for Maven Central
        working-directory: sdk/native/android
        run: ./gradlew publishReleasePublicationToBuildDirRepository --console=plain

      - run: node scripts/check-maven-artifact.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-artifact-reports
          path: |
            sdk/native/android/build/reports/tests/
            sdk/native/android/build/staging-repo/
          if-no-files-found: warn

  # The Kotlin SDK against a real server, for the same reason as the
  # iOS job below — and cheaper: Robolectric runs on the JVM, so this
  # needs no emulator, and Linux runners have Docker for Postgres.
  android-live-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: self-hosted/server

      - name: install example app deps
        working-directory: apps/rn-example
        run: bun install --frozen-lockfile

      - name: expo prebuild (generates the host Gradle project)
        working-directory: apps/rn-example
        run: bunx expo prebuild --platform android --no-install

      - name: kotlin SDK → real server → read the events back
        run: bash scripts/android-live-ingest.sh

  # The Swift SDK against a real server, because every other iOS test
  # asserts the shape the SDK *builds* and a mock would agree with
  # whatever mistake it is making.
  #
  # Runs on macOS with Homebrew Postgres: GitHub's macOS runners have
  # no Docker, and the simulator has to be on the same machine as the
  # server for 127.0.0.1 to mean the same thing to both.
  ios-live-ingest:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: self-hosted/server
          key: macos-live-ingest

      - name: swift SDK → real server → read the events back
        env:
          # The runner's newest simulator. `xcrun simctl list` names
          # change with Xcode; the script takes it as a parameter so a
          # rename is a one-line fix rather than a broken job.
          SENTORI_LIVE_DESTINATION: 'platform=iOS Simulator,name=iPhone 16'
        run: bash scripts/ios-live-ingest.sh

  # Round-trip symbolication against the v0.2 server: bundle a fixture,
  # upload its map, send a stack from the minified bundle, assert the
  # frames come back pointing at the original source.
  #
  # The unit tests in `self-hosted/server/src/symbolicate.rs` pin the
  # resolver's arithmetic against a hand-built map. This pins the part
  # they cannot: that a real Metro map, uploaded over HTTP, matched to a
  # release by name, produces the right answer.
  sourcemap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: sentori
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: self-hosted/server
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build + start server
        env:
          SENTORI_DATABASE_URL: postgres://postgres:dev@localhost:5432/sentori
          SENTORI_OWNER_EMAIL: ci@example.com
          SENTORI_OWNER_PASSWORD: ci-password-long-enough
          SENTORI_BASE_URL: http://localhost:8080
          # `fs:` rather than the default in-memory store: the
          # symbolicator reads the map back out, and an in-memory blob
          # store would work here by accident while hiding a real path.
          SENTORI_ATTACHMENT_STORE: fs:/tmp/sentori-blobs
        working-directory: self-hosted/server
        run: |
          mkdir -p /tmp/sentori-blobs
          cargo build
          # Migrations run at boot, so starting the binary is the whole
          # setup step.
          #
          # Keep the output. Without this the server's stdout went to
          # the job log interleaved with nothing to attribute it to,
          # and a panic mid-run showed up only as `curl: (52) Empty
          # reply from server` — the shape of the failure, never the
          # cause. The panic that closed this hole had to be
          # reproduced locally to be read at all.
          ./target/debug/sentori-server > /tmp/sentori-server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8080/healthz

      - name: symbolication round trip
        env:
          SENTORI_BASE: http://localhost:8080
          SENTORI_OWNER_EMAIL: ci@example.com
          SENTORI_OWNER_PASSWORD: ci-password-long-enough
        run: bash scripts/sourcemap-e2e/run-v1.sh

      - name: server log
        if: failure()
        run: cat /tmp/sentori-server.log
