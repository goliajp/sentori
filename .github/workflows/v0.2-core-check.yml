name: v0.2 core — fmt + clippy + test

on:
  push:
    # `fix/**` and `hotfix/**` were missing. git-flow.md makes fix/ and
    # feature/ equivalent — same start point, same merge target — so a
    # fix/ branch touching core/ or self-hosted/server/ simply had no CI
    # until it reached develop, which is exactly the delay this workflow
    # exists to prevent.
    branches: [feature/**, fix/**, hotfix/**, develop, master]
    paths:
      - 'core/**'
      - 'self-hosted/server/**'
      - '.github/workflows/v0.2-core-check.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'core/**'
      - 'self-hosted/server/**'

# Superseded pushes stop compiling. Master is never cancelled: its run is
# the record that a shipped sha was checked.
concurrency:
  group: v0.2-core-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The core crates' integration tests spin up their own Postgres
      # via testcontainers, so they need nothing but a docker daemon —
      # which the runner has. They were never run in CI: this job did
      # clippy and check only, so every assertion in
      # crates/*/tests/integration.rs was dead weight.
      - name: test
        run: cargo test --workspace --all-targets
      # `--all-targets` does not include doctests: the 22 examples in
      # these crates' public documentation had never been compiled by
      # anything. rustdoc's warnings are also the only thing that reads
      # an intra-doc link, and that ran in preflight but not here, so a
      # broken link reached master whenever nobody happened to run the
      # full local chain.
      - name: doctests
        run: cargo test --workspace --doc
      - name: doc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

  # The v0.2 server crate had no CI at all: build.yml tests the legacy
  # `server/` and this workflow tested `core/`, so nothing ever
  # compiled or ran the tests for the binary that actually ships in
  # the self-hosted image.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: self-hosted/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: self-hosted/server
      - name: fmt
        run: cargo fmt --all -- --check
      # The crate is clippy-clean, so warnings are hard failures here.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      - name: doc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps
